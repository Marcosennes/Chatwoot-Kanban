<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {} },
  corePlugins: { preflight: false },
}
</script>
<style>
:root {
  --bg-page: 254 254 254;
  --text-primary: 28 32 36;
  --text-secondary: 96 100 108;
  --text-muted: 138 143 155;
  --border: 240 240 243;
  --bg-card: 254 254 254;
  --bg-surface: 245 245 247;
  --accent: 39 129 246;
  --accent-hover: 16 115 233;
  --accent-focus: 39 129 246 / 0.15;
  --red: 229 70 102;
  --amber: 255 197 61;
  --green: 18 165 148;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: 20 21 23;
    --text-primary: 237 238 240;
    --text-secondary: 96 100 108;
    --text-muted: 110 115 128;
    --border: 40 42 46;
    --bg-card: 28 29 32;
    --bg-surface: 34 35 38;
    --accent: 39 129 246;
    --accent-hover: 16 115 233;
    --accent-focus: 39 129 246 / 0.2;
    --red: 229 70 102;
    --amber: 255 197 61;
    --green: 18 165 148;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: rgb(var(--text-primary));
  background: rgb(var(--bg-page));
  -webkit-font-smoothing: antialiased;
}

.board, .column-body {
  scrollbar-width: none;
}
.board::-webkit-scrollbar,
.column-body::-webkit-scrollbar {
  display: none;
}

.kanban-header {
  background: rgb(var(--bg-page));
  border-bottom: 1px solid rgb(var(--border));
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.notif { position: relative; margin-left: auto; }
.notif-bell {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  cursor: pointer;
}
.notif-bell:hover { background: rgb(var(--bg-surface)); color: rgb(var(--text-primary)); }
.notif-bell svg { width: 16px; height: 16px; }
.notif-bell.ring svg { animation: notif-ring 0.6s ease-in-out 2; transform-origin: 50% 10%; }
@keyframes notif-ring {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(14deg); }
  75% { transform: rotate(-14deg); }
}
@media (prefers-reduced-motion: reduce) { .notif-bell.ring svg { animation: none; } }
.notif-badge {
  position: absolute; top: -6px; right: -6px;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px;
  background: rgb(var(--red)); color: #fff;
  font-size: 11px; font-weight: 600; line-height: 18px; text-align: center;
  border: 2px solid rgb(var(--bg-page));
  box-sizing: content-box;
}
.notif-panel {
  position: absolute; top: calc(100% + 6px); right: 0;
  width: min(340px, calc(100vw - 32px));
  max-height: min(440px, 70vh); overflow-y: auto;
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.12);
  z-index: 30;
}
.notif-panel-title {
  padding: 10px 12px; font-size: 13px; font-weight: 600;
  color: rgb(var(--text-primary));
  border-bottom: 1px solid rgb(var(--border));
}
.notif-empty { padding: 20px 12px; font-size: 13px; color: rgb(var(--text-muted)); text-align: center; }
.notif-item {
  display: flex; gap: 10px; width: 100%;
  padding: 10px 12px; border: 0; border-bottom: 1px solid rgb(var(--border));
  background: transparent; text-align: left; cursor: pointer; font: inherit;
}
.notif-item:last-child { border-bottom: 0; }
.notif-item:hover { background: rgb(var(--bg-surface)); }
.notif-item.unread { background: rgb(var(--accent) / 0.06); }
.notif-item.unread:hover { background: rgb(var(--accent) / 0.12); }
.notif-body { flex: 1; min-width: 0; }
.notif-row { display: flex; align-items: center; gap: 6px; }
.notif-name {
  flex: 1; min-width: 0; font-size: 13px; color: rgb(var(--text-primary));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.notif-item.unread .notif-name { font-weight: 600; }
.notif-time { font-size: 11px; color: rgb(var(--text-muted)); flex-shrink: 0; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--accent)); flex-shrink: 0; }
.notif-msg {
  margin-top: 2px; font-size: 12px; color: rgb(var(--text-secondary));
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.kanban-header select {
  font-size: 13px;
  padding: 5px 10px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-primary));
  outline: none;
  cursor: pointer;
  line-height: 1.4;
}
.kanban-header select:focus {
  border-color: rgb(var(--accent));
  box-shadow: 0 0 0 2px rgb(var(--accent-focus));
}

.kanban-header .btn {
  padding: 5px 12px;
  font-size: 13px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  line-height: 1.4;
}
.kanban-header .btn:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}
.kanban-header .btn:active {
  background: rgb(var(--border));
}

.board {
  display: flex;
  gap: 12px;
  padding: 16px;
  overflow-x: auto;
  min-height: calc(100vh - 49px);
  align-items: flex-start;
}

.column {
  flex: 0 0 280px;
  max-width: 280px;
  background: rgb(var(--bg-surface));
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 82px);
}

.column-header {
  padding: 10px 12px 8px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: rgb(var(--text-secondary));
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgb(var(--border));
}

.column-header .count {
  font-weight: 400;
  font-size: 11px;
  color: rgb(var(--text-muted));
  background: rgb(var(--border));
  padding: 1px 7px;
  border-radius: 10px;
}

.column-body {
  padding: 8px;
  overflow-y: auto;
  flex: 1;
  min-height: 60px;
}

.column-body.drag-over {
  background: rgb(var(--accent) / 0.06);
  border-radius: 6px;
}

.card {
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: grab;
  transition: border-color 0.15s;
  position: relative;
}
.card:hover {
  border-color: rgb(var(--text-muted));
}
.card.dragging {
  opacity: 0.5;
  border-style: dashed;
}
.card:active { cursor: grabbing; }

.card-contact {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.card-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: rgb(var(--border));
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: rgb(var(--text-muted));
}
.card-avatar img {
  width: 100%; height: 100%; object-fit: cover;
}
.card-name {
  font-size: 13px;
  font-weight: 500;
  color: rgb(var(--text-primary));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-message {
  font-size: 12px;
  color: rgb(var(--text-secondary));
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 2px;
}
.card-open-chat {
  margin-left: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: rgb(var(--text-muted));
  cursor: pointer;
}
.card-open-chat:hover {
  background: rgb(var(--border));
  color: rgb(var(--text-primary));
}
.card-open-chat:disabled { opacity: 0.5; cursor: wait; }
.card-open-chat svg { width: 15px; height: 15px; }
.card-time {
  font-size: 11px;
  color: rgb(var(--text-muted));
  margin-top: 4px;
}

.card-task {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 6px;
  padding: 3px 9px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  background: rgb(var(--amber) / 0.12);
  color: rgb(180 120 0);
  border: 1px solid rgb(var(--amber) / 0.25);
  max-width: 100%;
}
.card-task.overdue {
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  border-color: rgb(var(--red) / 0.25);
}
.card-task-icon {
  flex-shrink: 0;
  font-size: 12px;
}
.card-task-date {
  white-space: nowrap;
}
.card-task-msg {
  display: none;
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  right: 0;
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 12px;
  color: rgb(var(--text-primary));
  line-height: 1.4;
  z-index: 20;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.1);
  word-break: break-word;
}
.card:hover .card-task-msg {
  display: block;
}

.empty-state {
  text-align: center;
  padding: 24px 12px;
  font-size: 13px;
  color: rgb(var(--text-muted));
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 49px);
  color: rgb(var(--text-muted));
  font-size: 14px;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid rgb(var(--border));
  border-top-color: rgb(var(--accent));
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@keyframes toastIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.error-banner {
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  border: 1px solid rgb(var(--red) / 0.2);
  border-radius: 6px;
  padding: 10px 14px;
  margin: 16px;
  font-size: 13px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgb(0 0 0 / 0.4);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: rgb(var(--bg-card));
  border: 1px solid rgb(var(--border));
  border-radius: 8px;
  width: 420px;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 64px);
  overflow-y: auto;
  animation: modalIn 0.15s ease-out;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  border-bottom: 1px solid rgb(var(--border));
}
.modal-header h3 {
  font-size: 14px;
  font-weight: 600;
  color: rgb(var(--text-primary));
}
.modal-close {
  width: 28px;
  height: 28px;
  border: none;
  background: none;
  color: rgb(var(--text-muted));
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  line-height: 1;
}
.modal-close:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}

.modal-body {
  padding: 16px;
}

.modal-contact {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.modal-contact .card-avatar {
  width: 32px;
  height: 32px;
  font-size: 13px;
}
.modal-contact .card-name {
  font-size: 14px;
}
.modal-contact a {
  font-size: 12px;
  color: rgb(var(--accent));
  text-decoration: none;
}
.modal-contact a:hover {
  text-decoration: underline;
}

.modal-field {
  margin-bottom: 12px;
}
.modal-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: rgb(var(--text-secondary));
  margin-bottom: 4px;
}
.modal-field input,
.modal-field textarea {
  width: 100%;
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-primary));
  outline: none;
  font-family: inherit;
}
.modal-field input:focus,
.modal-field textarea:focus {
  border-color: rgb(var(--accent));
  box-shadow: 0 0 0 2px rgb(var(--accent-focus));
}
.modal-field textarea {
  resize: vertical;
  min-height: 60px;
}

.modal-task-info {
  background: rgb(var(--bg-surface));
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 12px;
}
.modal-task-info .task-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 4px;
}
.modal-task-info .task-row:last-child {
  margin-bottom: 0;
}
.modal-task-info .task-label {
  color: rgb(var(--text-secondary));
}
.modal-task-info .task-value {
  color: rgb(var(--text-primary));
  font-weight: 500;
}

.modal-footer {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid rgb(var(--border));
  justify-content: flex-end;
}
.modal-footer .spacer {
  flex: 1;
}

.btn-primary {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  background: rgb(var(--accent));
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: rgb(var(--accent-hover));
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-secondary {
  padding: 6px 14px;
  font-size: 13px;
  border: 1px solid rgb(var(--border));
  border-radius: 6px;
  background: rgb(var(--bg-card));
  color: rgb(var(--text-secondary));
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.btn-secondary:hover {
  background: rgb(var(--bg-surface));
  color: rgb(var(--text-primary));
}

.btn-danger {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  border-radius: 6px;
  background: rgb(var(--red) / 0.1);
  color: rgb(var(--red));
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: rgb(var(--red) / 0.2);
}

.modal-task-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
}
</style>
</head>
<body>
<div id="app">
  <div class="loading"><div class="spinner"></div>Cargando tablero…</div>
</div>
<div id="task-modal-root"></div>

<script>
const API_CONFIG = '/kanban/config';
const API_BOARD = '/kanban/board';
const API_MOVE_STAGE = '/kanban/board';
const API_TASKS = '/kanban/tasks';

let chatwootUrl = '';
let chatwootAccountId = '';
let chatwootFrontendUrl = '';
let allColumns = [];
let activeFilter = '';
let currentModalCardId = null;
let pollingTimer = null;
let isTabVisible = true;
let lastGeneratedAt = null;
let pollInterval = 30000;
const MIN_POLL = 15000;
const MAX_POLL = 60000;

document.addEventListener('visibilitychange', () => {
  isTabVisible = !document.hidden;
  if (isTabVisible) refreshBoard();
});

const $ = (s, p) => (p || document).querySelector(s);
const $$ = (s, p) => [...(p || document).querySelectorAll(s)];

function timeAgo(dateStr) {
  if (!dateStr) return '';
  let d;
  if (typeof dateStr === 'number' || /^\d{10}(\.\d+)?$/.test(String(dateStr))) {
    d = new Date(Number(dateStr) * 1000);
  } else {
    d = new Date(dateStr);
  }
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diff = now - d;
  if (diff < 0) return 'ahora';
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'ahora';
  if (mins < 60) return `hace ${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `hace ${hrs}h`;
  const days = Math.floor(hrs / 24);
  return `hace ${days}d`;
}

function initials(name) {
  if (!name) return '?';
  return name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function computeTaskEstado(task) {
  if (!task) return null;
  if (task.estado === 'tarea_cerrada') {
    if (!task.cerrado_en) return 'tarea_cerrada';
    const cerrado = new Date(task.cerrado_en);
    const ahora = new Date();
    if (ahora - cerrado < 24 * 60 * 60 * 1000) return 'tarea_cerrada';
    return null;
  }
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const vence = new Date(task.fecha_vencimiento);
  vence.setHours(0, 0, 0, 0);
  const diffMs = vence - hoy;
  const diffDias = diffMs / (1000 * 60 * 60 * 24);
  if (diffDias < 0) return 'tarea_vencida';
  if (diffDias === 0) return 'tarea_hoy';
  return 'tarea_activa';
}

function renderTaskBadge(task) {
  if (!task) return '';
  const estado = computeTaskEstado(task);
  if (!estado) return '';
  const isOverdue = estado === 'tarea_vencida';
  const cls = isOverdue ? 'card-task overdue' : 'card-task';
  const dateStr = task.fecha_vencimiento
    ? new Date(task.fecha_vencimiento).toLocaleDateString('es-CL')
    : '';
  const msg = task.mensaje ? escapeHtml(task.mensaje) : '';
  return `
    <div class="${cls}" title="${msg}">
      <span class="card-task-icon">&#128197;</span>
      ${dateStr ? `<span class="card-task-date">${dateStr}</span>` : ''}
      ${msg ? `<div class="card-task-msg">${msg}</div>` : ''}
    </div>
  `;
}

async function loadConfig() {
  const res = await fetch(API_CONFIG);
  const data = await res.json();
  chatwootUrl = data.chatwoot_url || '';
  chatwootAccountId = data.chatwoot_account_id || '';
  chatwootFrontendUrl = data.chatwoot_frontend_url || '';
  allColumns = data.columns || [];
  return data;
}

async function loadBoard(stage) {
  const url = stage ? `${API_BOARD}?stage=${encodeURIComponent(stage)}` : API_BOARD;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    const msg = data.detail || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  chatwootAccountId = data.chatwoot_account_id || chatwootAccountId;
  return data;
}

function openContact(id) {
  if (!id) return;
  const base = (chatwootFrontendUrl || chatwootUrl).replace(/\/+$/, '');
  const url = chatwootAccountId
    ? `${base}/app/accounts/${chatwootAccountId}/contacts/${id}`
    : '';
  if (url) window.open(url, '_blank');
}

async function openConversation(contactId, button) {
  if (button) button.disabled = true;
  try {
    const res = await fetch(`/kanban/contacts/${contactId}/conversation`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      showToast(
        res.status === 404 ? 'Este contato não tem conversas' : (data.detail || 'Erro ao abrir conversa'),
        'error',
      );
      return;
    }
    navigateInChatwoot(data.path, data.url);
  } catch (err) {
    showToast('Erro ao abrir conversa', 'error');
  } finally {
    if (button) button.disabled = false;
  }
}

function navigateInChatwoot(path, url) {
  if (window.parent === window) {
    window.open(url, '_blank');
    return;
  }
  let handled = false;
  const onAck = (event) => {
    if (event.data && event.data.type === 'kanban:navigate-ack') handled = true;
  };
  window.addEventListener('message', onAck);
  window.parent.postMessage({ type: 'kanban:navigate', path }, '*');
  setTimeout(() => {
    window.removeEventListener('message', onAck);
    if (!handled) window.open(url, '_blank');
  }, 400);
}

function openTaskModal(cardData) {
  currentModalCardId = cardData.id;
  stopPolling();
  const task = cardData.task || null;
  const root = document.getElementById('task-modal-root');

  const taskColors = {
    tarea_activa: { bg: 'rgb(var(--accent) / 0.1)', text: 'rgb(var(--accent))' },
    tarea_hoy: { bg: 'rgb(var(--amber) / 0.15)', text: 'rgb(180 120 0)' },
    tarea_vencida: { bg: 'rgb(var(--red) / 0.1)', text: 'rgb(var(--red))' },
    tarea_cerrada: { bg: 'rgb(var(--text-muted) / 0.15)', text: 'rgb(var(--text-secondary))' },
  };
  const taskLabels = {
    tarea_activa: 'Activa',
    tarea_hoy: 'Vence hoy',
    tarea_vencida: 'Vencida',
    tarea_cerrada: 'Cerrada',
  };

  const base = (chatwootFrontendUrl || chatwootUrl).replace(/\/+$/, '');
  const chatwootLink = chatwootAccountId
    ? `${base}/app/accounts/${chatwootAccountId}/contacts/${cardData.id}`
    : '';

  let taskSection = '';
  if (task) {
    const computedEstado = computeTaskEstado(task);
    const tc = taskColors[computedEstado] || taskColors.tarea_activa;
    const tl = taskLabels[computedEstado] || computedEstado;
    const isClosed = computedEstado === 'tarea_cerrada';
    const fechaDisplay = task.fecha_vencimiento
      ? new Date(task.fecha_vencimiento).toLocaleDateString('es-CL')
      : '—';
    taskSection = `
      <div class="modal-task-info">
        <div class="task-row">
          <span class="task-label">Estado</span>
          <span class="modal-task-status" style="background:${tc.bg};color:${tc.text}">${tl}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Mensaje</span>
          <span class="task-value">${escapeHtml(task.mensaje)}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Vencimiento</span>
          <span class="task-value">${fechaDisplay}</span>
        </div>
        <div class="task-row">
          <span class="task-label">Creada por</span>
          <span class="task-value">${escapeHtml(task.creado_por || '—')}</span>
        </div>
      </div>
      ${isClosed ? '' : `
        <div class="modal-field">
          <label for="task-msg">Mensaje</label>
          <textarea id="task-msg" rows="2">${escapeHtml(task.mensaje)}</textarea>
        </div>
        <div class="modal-field">
          <label for="task-date">Vencimiento</label>
          <input type="date" id="task-date" value="${task.fecha_vencimiento || ''}">
        </div>
      `}
    `;
  } else {
    taskSection = `
      <div class="modal-field">
        <label for="task-msg">Mensaje de la tarea</label>
        <textarea id="task-msg" rows="2" placeholder="Ej: Enviar propuesta comercial"></textarea>
      </div>
      <div class="modal-field">
        <label for="task-date">Fecha de vencimiento</label>
        <input type="date" id="task-date">
      </div>
    `;
  }

  const computedEstado = task ? computeTaskEstado(task) : null;
  const taskStatus = task && computedEstado
    ? `<span class="modal-task-status" style="background:${(taskColors[computedEstado] || taskColors.tarea_activa).bg};color:${(taskColors[computedEstado] || taskColors.tarea_activa).text}">${taskLabels[computedEstado] || computedEstado}</span>`
    : '<span style="font-size:12px;color:rgb(var(--text-muted))">Sin tarea</span>';

  let footerButtons = '';
  if (task && computedEstado && computedEstado !== 'tarea_cerrada') {
    footerButtons = `
      <button class="btn-danger" id="modal-close-task">Cerrar tarea</button>
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-save">Guardar</button>
    `;
  } else if (task && computedEstado === 'tarea_cerrada') {
    footerButtons = `
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Cerrar</button>
    `;
  } else {
    footerButtons = `
      <div class="spacer"></div>
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-create">Crear tarea</button>
    `;
  }

  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3>${escapeHtml(cardData.contact_name || 'Conversación')}</h3>
          <button class="modal-close" id="modal-close-x">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-contact">
            <div class="card-avatar">${cardData.thumbnail ? `<img src="${cardData.thumbnail}" alt="">` : initials(cardData.contact_name)}</div>
            <div>
              <div class="card-name">${escapeHtml(cardData.contact_name)}</div>
              <a href="${chatwootLink}" target="_blank" rel="noopener">Abrir en Chatwoot</a>
            </div>
          </div>
          <div style="margin-bottom:12px">
            <span style="font-size:12px;font-weight:500;color:rgb(var(--text-secondary))">Tarea: </span>${taskStatus}
          </div>
          ${taskSection}
        </div>
        <div class="modal-footer">
          ${footerButtons}
        </div>
      </div>
    </div>
  `;

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeTaskModal();
  });
  document.getElementById('modal-close-x').addEventListener('click', closeTaskModal);
  document.getElementById('modal-cancel')?.addEventListener('click', closeTaskModal);

  if (task && computedEstado && computedEstado !== 'tarea_cerrada') {
    document.getElementById('modal-save')?.addEventListener('click', () => saveTask(task.id));
    document.getElementById('modal-close-task')?.addEventListener('click', () => closeTaskAction(task.id));
  } else if (!task) {
    document.getElementById('modal-create')?.addEventListener('click', () => createTask(cardData.id));
  }
}

function closeTaskModal() {
  document.getElementById('task-modal-root').innerHTML = '';
  currentModalCardId = null;
  startPolling();
}

function optimisticTaskUpdate(contactId, taskData) {
  const card = document.querySelector(`.card[data-contact-id="${contactId}"]`);
  if (!card) return;
  card.dataset.task = JSON.stringify(taskData);
  const badge = card.querySelector('.card-task');
  if (badge) badge.remove();
  const badgeHTML = renderTaskBadge(taskData);
  if (badgeHTML) {
    const timeEl = card.querySelector('.card-time');
    if (timeEl) {
      timeEl.insertAdjacentHTML('beforebegin', badgeHTML);
    }
  }
}

async function createTask(contactId) {
  const msg = document.getElementById('task-msg')?.value?.trim();
  const date = document.getElementById('task-date')?.value;
  if (!msg) { showToast('Escribe un mensaje para la tarea', 'error'); return; }
  if (!date) { showToast('Selecciona una fecha de vencimiento', 'error'); return; }

  const btn = document.getElementById('modal-create');
  if (btn) { btn.disabled = true; btn.textContent = 'Creando…'; }

  optimisticTaskUpdate(contactId, {
    id: null,
    estado: 'tarea_activa',
    mensaje: msg,
    fecha_vencimiento: date,
    creado_por: '',
  });
  closeTaskModal();

  try {
    const res = await fetch(API_TASKS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contact_id: contactId, mensaje: msg, fecha_vencimiento: date }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast(data.action === 'updated' ? 'Tarea actualizada' : 'Tarea creada');
  } catch (err) {
    showToast(`Error: ${err.message}`, 'error');
    refreshBoard();
  }
}

async function saveTask(taskId) {
  const msg = document.getElementById('task-msg')?.value?.trim();
  const date = document.getElementById('task-date')?.value;
  if (!msg) { showToast('Escribe un mensaje para la tarea', 'error'); return; }
  if (!date) { showToast('Selecciona una fecha de vencimiento', 'error'); return; }

  const btn = document.getElementById('modal-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Guardando…'; }

  optimisticTaskUpdate(currentModalCardId, {
    id: taskId,
    estado: 'tarea_activa',
    mensaje: msg,
    fecha_vencimiento: date,
    creado_por: '',
  });
  closeTaskModal();

  try {
    const res = await fetch(`${API_TASKS}/${taskId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: msg, fecha_vencimiento: date }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast('Tarea actualizada');
  } catch (err) {
    showToast(`Error: ${err.message}`, 'error');
    refreshBoard();
  }
}

async function closeTaskAction(taskId) {
  const btn = document.getElementById('modal-close-task');
  if (btn) { btn.disabled = true; btn.textContent = 'Cerrando…'; }

  optimisticTaskUpdate(currentModalCardId, null);
  closeTaskModal();

  try {
    const res = await fetch(`${API_TASKS}/${taskId}/close`, { method: 'PATCH' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    showToast('Tarea cerrada');
  } catch (err) {
    showToast(`Error: ${err.message}`, 'error');
    refreshBoard();
  }
}

function resetStateFilter() {
  const sel = document.getElementById('state-filter');
  if (sel) sel.value = '';
}

const NOTIF_POLL_MS = 10000;
const BELL_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
  <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
</svg>`;
const notifState = { items: [], unread: 0, open: false, ring: false };
const baseTitle = document.title;

async function loadNotifications() {
  try {
    const res = await fetch('/kanban/notifications');
    if (!res.ok) return;
    const data = await res.json();
    notifState.ring = (data.unread || 0) > notifState.unread;
    notifState.items = data.items || [];
    notifState.unread = data.unread || 0;
    document.title = notifState.unread ? `(${notifState.unread}) ${baseTitle}` : baseTitle;
    renderNotifications();
  } catch (err) {
    console.error('Notifications refresh failed:', err);
  }
}

function notificationSnippet(item) {
  if (item.content) return escapeHtml(item.content);
  return item.has_attachments ? '📎 Anexo' : '';
}

function renderNotifications() {
  const root = document.getElementById('notif-root');
  if (!root) return;
  const { items, unread, open } = notifState;
  const badge = unread ? `<span class="notif-badge">${unread > 99 ? '99+' : unread}</span>` : '';
  const list = items.length
    ? items.map((item, i) => `
        <button type="button" class="notif-item${item.unread_count ? ' unread' : ''}" data-index="${i}">
          <div class="card-avatar">${item.thumbnail ? `<img src="${escapeHtml(item.thumbnail)}" alt="">` : escapeHtml(initials(item.contact_name))}</div>
          <div class="notif-body">
            <div class="notif-row">
              <span class="notif-name">${escapeHtml(item.contact_name || 'Sem nome')}</span>
              <span class="notif-time">${timeAgo(item.last_activity_at)}</span>
              ${item.unread_count ? '<span class="notif-dot" title="Não lida"></span>' : ''}
            </div>
            <div class="notif-msg">${notificationSnippet(item)}</div>
          </div>
        </button>`).join('')
    : '<div class="notif-empty">Nenhuma mensagem nova</div>';

  root.innerHTML = `
    <button type="button" class="notif-bell${notifState.ring ? ' ring' : ''}" id="notif-bell"
      aria-haspopup="true" aria-expanded="${open}"
      title="${unread ? `${unread} conversa(s) não lida(s)` : 'Notificações'}">
      ${BELL_SVG}${badge}
    </button>
    ${open ? `<div class="notif-panel" role="menu">
      <div class="notif-panel-title">Mensagens recentes</div>${list}</div>` : ''}
  `;
  notifState.ring = false;

  root.querySelector('#notif-bell').addEventListener('click', (e) => {
    e.stopPropagation();
    notifState.open = !notifState.open;
    renderNotifications();
  });
  root.querySelectorAll('.notif-item').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = notifState.items[Number(btn.dataset.index)];
      if (!item) return;
      notifState.open = false;
      renderNotifications();
      const base = (chatwootFrontendUrl || chatwootUrl).replace(/\/+$/, '');
      navigateInChatwoot(item.path, base + item.path);
    });
  });
}

document.addEventListener('click', (e) => {
  if (!notifState.open) return;
  if (e.target.closest && e.target.closest('#notif-root')) return;
  notifState.open = false;
  renderNotifications();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && notifState.open) {
    notifState.open = false;
    renderNotifications();
  }
});

function startNotifications() {
  loadNotifications();
  setInterval(() => { if (isTabVisible) loadNotifications(); }, NOTIF_POLL_MS);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadNotifications();
  });
}

function renderBoard(data) {
  const columns = data.columns || [];
  const app = document.getElementById('app');

  if (columns.length === 0) {
    app.innerHTML = `<div class="error-banner">No hay columnas configuradas. Verifica que existe el custom attribute <strong>pipeline_01_etapas</strong> en Chatwoot.</div>`;
    return;
  }

  app.innerHTML = `
    <div class="kanban-header">
      <select id="pipeline-select">
        <option value="">Todas las etapas</option>
        ${columns.map(c => `<option value="${c.stage}">${c.stage}</option>`).join('')}
      </select>
      <select id="state-filter">
        <option value="">Todas las tareas</option>
        <option value="tarea_activa">Activa</option>
        <option value="tarea_hoy">Vence hoy</option>
        <option value="tarea_vencida">Vencida</option>
        <option value="tarea_cerrada">Cerrada</option>
        <option value="sin_tarea">Sin tarea</option>
      </select>
      <button class="btn" id="refresh-btn">Actualizar</button>
      <a href="/kanban/dashboard" class="btn">Dashboard</a>
      <div class="notif" id="notif-root"></div>
    </div>
    <div class="board" id="board"></div>
  `;
  renderNotifications();

  document.getElementById('pipeline-select').addEventListener('change', () => {
    activeFilter = '';
    document.getElementById('state-filter').value = '';
    refreshBoard();
  });
  document.getElementById('state-filter').addEventListener('change', () => {
    refreshBoard();
  });
  document.getElementById('refresh-btn').addEventListener('click', () => refreshBoard());

  const board = document.getElementById('board');
  renderColumns(columns, board);
}

async function refreshBoard() {
  const stage = document.getElementById('pipeline-select')?.value;
  const taskFilter = document.getElementById('state-filter')?.value;
  activeFilter = taskFilter;

  const board = document.getElementById('board');
  board.innerHTML = `<div class="loading" style="min-height:200px"><div class="spinner"></div>Cargando…</div>`;

  try {
    const data = await loadBoard(stage || undefined);
    lastGeneratedAt = data.generated_at || null;
    renderColumns(data.columns || [], board);
  } catch (err) {
    const isChatwoot = err.message.includes('Chatwoot');
    const hint = isChatwoot
      ? 'Verifica que Chatwoot esté accesible y el bot-token sea válido.'
      : 'Revisa los logs del contenedor para más detalles.';
    board.innerHTML = `<div class="error-banner"><strong>Error:</strong> ${escapeHtml(err.message)}<br><small>${hint}</small></div>`;
  }
}

function renderColumns(columns, board) {
  board.innerHTML = '';
  columns.forEach(col => {
    let cards = col.contacts || [];
    if (activeFilter) {
      cards = cards.filter(c => {
        const estado = computeTaskEstado(c.task);
        if (activeFilter === 'sin_tarea') return !estado;
        return estado === activeFilter;
      });
    }

    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.stage = col.stage;
    colEl.innerHTML = `
      <div class="column-header">
        <span>${col.stage}</span>
        <span class="count">${cards.length}</span>
      </div>
      <div class="column-body" data-stage="${col.stage}"></div>
    `;

    const body = colEl.querySelector('.column-body');
    cards.forEach(card => {
      body.appendChild(createCard(card));
    });

    setupDropZone(body, col.stage);
    board.appendChild(colEl);
  });
}

function createCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.draggable = true;
  el.dataset.contactId = card.id;
  el.dataset.customAttributes = JSON.stringify(card.custom_attributes || {});
  if (card.task) el.dataset.task = JSON.stringify(card.task);

  el.innerHTML = `
    <div class="card-contact">
      <div class="card-avatar">${card.thumbnail ? `<img src="${card.thumbnail}" alt="">` : initials(card.contact_name)}</div>
      <div class="card-name">${card.contact_name}</div>
      <button type="button" class="card-open-chat" draggable="false"
        title="Abrir conversa" aria-label="Abrir conversa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
        </svg>
      </button>
    </div>
    ${card.task ? renderTaskBadge(card.task) : ''}
    <div class="card-time">${timeAgo(card.last_activity_at)}</div>
  `;

  el.addEventListener('dragstart', (e) => {
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', JSON.stringify({
      id: card.id,
      stage: el.closest('.column').dataset.stage,
    }));
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));

  const chatBtn = el.querySelector('.card-open-chat');
  chatBtn.addEventListener('mousedown', (e) => e.stopPropagation());
  chatBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openConversation(card.id, chatBtn);
  });

  el.addEventListener('click', () => {
    openTaskModal({
      id: card.id,
      contact_name: card.contact_name,
      thumbnail: card.thumbnail,
      task: card.task || null,
    });
  });

  return el;
}

function setupDropZone(body, targetStage) {
  body.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    body.classList.add('drag-over');
  });
  body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
  body.addEventListener('drop', async (e) => {
    e.preventDefault();
    body.classList.remove('drag-over');
    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
    if (data.stage === targetStage) return;

    const draggable = document.querySelector(`.card[data-contact-id="${data.id}"]`);
    if (!draggable) return;

    const originalStage = draggable.closest('.column').dataset.stage;

    try {
      const res = await fetch(`${API_MOVE_STAGE}/${data.id}/stage`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stage: targetStage }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Error desconocido' }));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      draggable.remove();
      const targetBody = document.querySelector(`.column-body[data-stage="${targetStage}"]`);
      if (targetBody) {
        const cardData = {
          id: data.id,
          contact_name: draggable.querySelector('.card-name')?.textContent || '',
          thumbnail: draggable.querySelector('img')?.src || '',
          last_activity_at: new Date().toISOString(),
          custom_attributes: JSON.parse(draggable.dataset.customAttributes || '{}'),
          task: draggable.dataset.task ? JSON.parse(draggable.dataset.task) : null,
        };
        targetBody.insertBefore(createCard(cardData), targetBody.firstChild);
      }
      updateCounts();
    } catch (err) {
      console.error('Drop failed:', err);
      showToast(`Error al mover: ${err.message}`, 'error');
    }
  });
}

function updateCounts() {
  $$('.column').forEach(col => {
    const count = col.querySelectorAll('.card').length;
    const badge = col.querySelector('.count');
    if (badge) badge.textContent = count;
  });
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}

function showToast(message, type = 'info') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.cssText = `
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    padding: 10px 16px; border-radius: 6px; font-size: 13px;
    color: #fff; max-width: 340px; word-break: break-word;
    animation: toastIn 0.2s ease-out;
  `;
  toast.style.background = type === 'error'
    ? 'rgb(var(--red))'
    : 'rgb(var(--green))';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}

function startPolling() {
  stopPolling();
  lastGeneratedAt = null;
  pollInterval = MIN_POLL;
  scheduleNextPoll();
}

function scheduleNextPoll() {
  pollingTimer = setTimeout(async () => {
    if (!isTabVisible || currentModalCardId) {
      scheduleNextPoll();
      return;
    }
    try {
      const stage = document.getElementById('pipeline-select')?.value;
      const data = await loadBoard(stage || undefined);
      const changed = !data.generated_at || data.generated_at !== lastGeneratedAt;
      if (changed) {
        lastGeneratedAt = data.generated_at || null;
        const board = document.getElementById('board');
        renderColumns(data.columns || [], board);
        pollInterval = MIN_POLL;
      } else {
        pollInterval = Math.min(pollInterval + 10000, MAX_POLL);
      }
    } catch (err) {
      console.error('Polling refresh failed:', err);
    }
    scheduleNextPoll();
  }, pollInterval);
}

function stopPolling() {
  if (pollingTimer) {
    clearTimeout(pollingTimer);
    pollingTimer = null;
  }
}

async function init() {
  try {
    const config = await loadConfig();
    const data = await loadBoard();
    lastGeneratedAt = data.generated_at || null;
    renderBoard(data);
    startPolling();
    startNotifications();
  } catch (err) {
    const detail = err.message || 'Error desconocido';
    document.getElementById('app').innerHTML =
      `<div class="error-banner"><strong>Error al iniciar el tablero:</strong> ${escapeHtml(detail)}<br><small> revisa <code>/kanban/debug-status</code> para diagnóstico.</small></div>`;
  }
}

init();
</script>
